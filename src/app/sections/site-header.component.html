<header class="site-header" [class.site-header--scrolled]="isScrolled()">
  <a class="site-header__brand" href="#inicio" aria-label="HODATEAM, inicio" (click)="closeMenu()">
    <img src="/assets/hodateam-logo.webp" alt="HODATEAM" width="166" height="28" fetchpriority="high" />
  </a>

  <button
    #menuToggle
    class="site-header__toggle"
    type="button"
    aria-controls="primary-navigation"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Cerrar navegación' : 'Abrir navegación'"
    (click)="toggleMenu()"
  >
    <span></span><span></span>
  </button>

  <nav
    id="primary-navigation"
    class="site-header__nav"
    [class.site-header__nav--open]="menuOpen()"
    aria-label="Navegación principal"
  >
    <a href="#inicio" [attr.aria-current]="isCurrent('inicio') ? 'location' : null" (click)="closeMenu()">Inicio</a>
    <a href="#identidad" [attr.aria-current]="isCurrent('identidad') ? 'location' : null" (click)="closeMenu()">El equipo</a>
    <a href="#capacidades" [attr.aria-current]="isCurrent('capacidades') ? 'location' : null" (click)="closeMenu()">Capacidades</a>
    <a href="#enfoque" [attr.aria-current]="isCurrent('enfoque') ? 'location' : null" (click)="closeMenu()">Enfoque</a>
    <a href="#proyectos" [attr.aria-current]="isCurrent('proyectos') ? 'location' : null" (click)="closeMenu()">Proyectos</a>
    <a
      class="site-header__contact"
      href="#codigo-abierto"
      [attr.aria-current]="isCurrent('codigo-abierto') ? 'location' : null"
      (click)="closeMenu()"
    >
      Código abierto
    </a>
  </nav>
</header>
