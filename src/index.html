    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <script>
      try {
        if (
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
          !window.sessionStorage.getItem('hodateam-entry-played')
        ) {
          document.documentElement.classList.add('entry-active');
          window.sessionStorage.setItem('hodateam-entry-played', 'true');
        }
      } catch {
        // The page remains available if browser storage is restricted.
      }
    </script>
    <meta
      name="description"
